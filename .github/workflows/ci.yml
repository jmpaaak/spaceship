name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LÖVE
        run: sudo apt-get update && sudo apt-get install -y love
      - name: Runtime unit tests
        run: GAME_HEADLESS=1 GAME_UNIT=1 love .
      - name: Verify package contract
        run: make -n love
